# Employer ATS boards.
#
# Supported ats values: greenhouse, lever, ashby, workable, smartrecruiters.
# Ingest validates every board against its public endpoint and silently drops
# boards that 404 or are disabled, so this file is safe to extend.
#
# `country` is only a hint for the logo/flag fallback; the listing's own
# location always wins. `type` is company or ngo.
#
# Add employers freely. Cross-sector coverage matters: health, hospitality,
# logistics, construction, manufacturing, universities and NGOs as well as tech.
companies:
