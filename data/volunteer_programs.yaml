# Curated volunteer programmes.
#
# RULES
#  * verified: true ONLY when the official page documents visa support or an
#    invitation letter. evidence_url must point at that page.
#  * Unverified entries are hidden everywhere.
#  * fee_required: true entries are hidden by default (user must opt in) and
#    always show a "Participation fee" tag.
#  * Never add organisations that tell volunteers to arrange their own visa;
#    the classifier's negative phrases will suppress them anyway.
#
# verified_on is the date a human last checked the evidence page. Re-check often.
programs:
