    aliases: ["ESC", "Erasmus+ volunteering"]
    country: null
    org_type: government
    official_url: "https://youth.europa.eu/solidarity_en"
    application_url: "https://youth.europa.eu/solidarity/young-people/volunteering_en"
    visa_support: "Host organisations provide an invitation letter and visa guidance; the programme covers travel, accommodation, food and insurance."
