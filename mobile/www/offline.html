<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>WorkAtlas — Offline</title>
  <style>
    :root {
      --bg: #0b1220;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --blue: #0a84ff;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --blue: #0071e3; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 340px; }
    .mark { width: 84px; height: 84px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 26px;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .hint { margin-top: 18px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
      <rect width="96" height="96" rx="22" fill="#0b1220"/>
      <g fill="#0a84ff">
        <circle cx="48" cy="18" r="3.4"/><circle cx="61" cy="21.5" r="3.4"/>
        <circle cx="70.5" cy="31" r="3.4"/><circle cx="74" cy="44" r="3.4"/>
        <circle cx="70.5" cy="57" r="3.4"/><circle cx="61" cy="66.5" r="3.4"/>
        <circle cx="48" cy="70" r="3.4"/><circle cx="35" cy="66.5" r="3.4"/>
        <circle cx="25.5" cy="57" r="3.4"/><circle cx="22" cy="44" r="3.4"/>
        <circle cx="25.5" cy="31" r="3.4"/><circle cx="35" cy="21.5" r="3.4"/>
      </g>
      <path d="M38 48h20M38 40h14M38 56h14" stroke="#f5f5f7" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>You are offline</h1>
    <p>WorkAtlas needs a connection to load verified listings. Reconnect, then try again.</p>
    <button class="retry" type="button" id="retry">Try again</button>
    <p class="hint">Your account and saved jobs stay on the server and will be here when you return.</p>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var target = (window.EJP_APP_URL || "https://app.workatlas.pro").replace(/\/+$/, "");
      document.getElementById("retry").addEventListener("click", function () {
        location.replace(target + "/");
      });
    })();
  </script>
</body>
</html>
