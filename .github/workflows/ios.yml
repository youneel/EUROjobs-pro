name: iOS — build and upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString (for example 1.0.0)"
        required: true
        default: "1.0.0"
      upload:
        description: "Upload the IPA to App Store Connect after building"
        type: boolean
        default: false
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # App Store signing and archiving require macOS and Xcode.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Point the shell at the hosted backend
        working-directory: mobile
        env:
          EJP_APP_URL: ${{ vars.EJP_APP_URL }}
        run: |
          if [ -z "$EJP_APP_URL" ]; then
            echo "Set the repository variable EJP_APP_URL to your public HTTPS backend." >&2
            exit 1
          fi
          npm run prepare:web
          npx cap sync ios

      - name: Write App Store Connect API key
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/ios-v') }}
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Build archive
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.eurojobspro.app' }}
          VERSION: ${{ inputs.marketing_version || '1.0.0' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$TEAM_ID" ]; then
            echo "Set the APPLE_TEAM_ID secret (10-character Apple Developer Team ID)." >&2
            exit 1
          fi
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/EuroJobsPro.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EuroJobsPro.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroJobsPro-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight / App Store Connect
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/ios-v') }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
